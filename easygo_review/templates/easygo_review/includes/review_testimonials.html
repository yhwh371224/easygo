{% load static %}
{% if reviews %}
      <!-- ===== TESTIMONIALS (latest reviews from /easygo_review/) ===== -->
      <section class="pt-0 pt-md-5">
        <div class="container">
          <div class="text-center position-relative py-5 testimonials-bg">
            <img
              loading="lazy"
              src="{% static 'basecamp/images/map.svg' %}"
              alt=""
              style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;"
            >
            <div class="bg-overlay bg-dark opacity-1"></div>
            <div class="row mb-5">
              <div class="col-12"><h3>{{ heading }}</h3></div>
            </div>
            <div class="row">
              <div class="col-md-9 col-xl-6 mx-auto">
                <div class="tiny-slider dots-primary">
                  <div class="tiny-slider-inner" data-autoplay="6000" data-arrow="false" data-dots="true" data-edge="2" data-items="1">
                    {% for r in reviews %}
                    <div>
                      <p class="mb-2" aria-label="{{ r.rating }} out of 5 stars">{% for _ in "12345"|make_list|slice:r.rating %}⭐{% endfor %}</p>
                      <p class="h5 fw-light mb-3">"{{ r.text }}"</p>
                      <div class="h5 {% if forloop.last %}mb-0{% else %}mb-3{% endif %}">
                        <a href="{{ r.url }}" class="text-reset text-decoration-none">— {{ r.name }}</a>{% if r.date %}<span class="fs-sm fw-normal opacity-75">, {{ r.date|date:"M Y" }}</span>{% endif %}
                      </div>
                    </div>{% if not forloop.last %}<br>{% endif %}
                    {% endfor %}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
{% endif %}
